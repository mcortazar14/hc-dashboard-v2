name: Sync HC Dashboard

on:
  workflow_dispatch:  # solo manual por ahora (fase 10 agrega el cron)

concurrency:
  group: sync
  cancel-in-progress: false  # nunca cancela un sync en curso

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        env:
          GHL_TOKEN:                    ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID:              ${{ secrets.GHL_LOCATION_ID }}
          SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:         ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node sync/index.js
